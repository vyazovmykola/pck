<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCK SIM Warszawa | Wybierz wersję</title>
    <link rel="icon" type="image/png" href="pck-image.png">
    
     
</head>
<body>
    <main>
        <img src="pck-image.png" alt="Logo Polskiego Czerwonego Krzyża">
        <h1>PCK SIM Warszawa</h1>
        <p>Wybierz wersję strony, którą chcesz obejrzeć.</p>
        <div class="options">
            <section class="option">
                <h2>Opcja 1</h2>
                <p>Klasyczny układ strony</p>
                <div class="actions">
                    <a href="opcja-1/M%C5%82odzie%C5%BC%20PCK%20Warszawa.html">Otwórz stronę</a>
                    <button type="button" data-phone-preview="opcja-1/M%C5%82odzie%C5%BC%20PCK%20Warszawa.html">Podgląd telefonu</button>
                </div>
            </section>
            <section class="option">
                <h2>Opcja 2</h2>
                <p>Wersja z animowanym scrollem</p>
                <div class="actions">
                    <a href="opcja-2/index.html">Otwórz stronę</a>
                    <button type="button" data-phone-preview="opcja-2/index.html">Podgląd telefonu</button>
                </div>
            </section>
        </div>
    </main>
    <div class="phone-modal" id="phone-modal" hidden>
        <div class="phone-window" role="dialog" aria-modal="true" aria-label="Podgląd strony na telefonie">
            <button class="phone-close" id="phone-close" type="button">Zamknij</button>
            <iframe class="phone-screen" id="phone-screen" title="Podgląd strony w rozmiarze telefonu"></iframe>
        </div>
    </div>
    <script>
        const modal = document.getElementById('phone-modal');
        const screen = document.getElementById('phone-screen');
        document.querySelectorAll('[data-phone-preview]').forEach((button) => {
            button.addEventListener('click', () => {
                screen.src = button.dataset.phonePreview;
                modal.hidden = false;
            });
        });
        document.getElementById('phone-close').addEventListener('click', () => {
            modal.hidden = true;
            screen.src = '';
        });
        modal.addEventListener('click', (event) => {
            if (event.target === modal) document.getElementById('phone-close').click();
        });
    </script>
</body>
</html>
