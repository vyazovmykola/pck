<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCK SIM Warszawa | Wybierz wersję</title>
    <link rel="icon" type="image/png" href="pck-image.png">
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #172443; color: #fff; }
        main { width: min(92%, 900px); padding: 3rem 1.5rem; text-align: center; }
        img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 1.5rem; background: #fff; border-radius: 8px; }
        h1 { margin: 0 0 .8rem; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -.05em; }
        p { margin: 0 auto 2.5rem; color: #dce3ef; line-height: 1.6; }
        .options { display: grid; gap: 1rem; grid-template-columns: repeat(2, 1fr); }
        .option { padding: 1.25rem; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; background: rgba(255,255,255,.07); }
        .option h2 { margin: 0 0 .35rem; font-size: 1.25rem; }
        .option p { margin: 0 0 1rem; font-size: .9rem; }
        .actions { display: grid; gap: .65rem; }
        a, button { display: block; width: 100%; padding: .9rem 1rem; border: 0; border-radius: 6px; background: #e30613; color: #fff; font: inherit; font-weight: bold; text-decoration: none; cursor: pointer; transition: transform .2s, background .2s; }
        a:hover, button:hover { transform: translateY(-3px); background: #b4000b; }
        button { background: #fff; color: #172443; }
        button:hover { background: #dfe8f3; }
        small { display: block; margin-top: .45rem; color: #ffd7d9; font-weight: normal; }
        .phone-modal { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 1rem; background: rgba(5,12,27,.86); }
        .phone-modal[hidden] { display: none; }
        .phone-window { position: relative; width: min(390px, 90vw); height: min(844px, 90vh); padding: 12px; border: 2px solid #52627e; border-radius: 32px; background: #080e1d; box-shadow: 0 24px 80px rgba(0,0,0,.55); }
        .phone-screen { width: 100%; height: 100%; border: 0; border-radius: 22px; background: #fff; }
        .phone-close { position: absolute; top: -3rem; right: 0; width: auto; padding: .65rem 1rem; background: #fff; color: #172443; }
        @media (max-width: 560px) { .options { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main>
        <img src="pck-image.png" alt="Logo Polskiego Czerwonego Krzyża">
        <h1>PCK SIM Warszawa</h1>
        <p>Wybierz wersję strony, którą chcesz obejrzeć.</p>
        <div class="options">
            <section class="option">
                <h2>Opcja 1</h2>
                <p>Klasyczny układ strony</p>
                <div class="actions">
                    <a href="opcja-1/M%C5%82odzie%C5%BC%20PCK%20Warszawa.html">Otwórz stronę</a>
                    <button type="button" data-phone-preview="opcja-1/M%C5%82odzie%C5%BC%20PCK%20Warszawa.html">Podgląd telefonu</button>
                </div>
            </section>
            <section class="option">
                <h2>Opcja 2</h2>
                <p>Wersja z animowanym scrollem</p>
                <div class="actions">
                    <a href="opcja-2/index.html">Otwórz stronę</a>
                    <button type="button" data-phone-preview="opcja-2/index.html">Podgląd telefonu</button>
                </div>
            </section>
        </div>
    </main>
    <div class="phone-modal" id="phone-modal" hidden>
        <div class="phone-window" role="dialog" aria-modal="true" aria-label="Podgląd strony na telefonie">
            <button class="phone-close" id="phone-close" type="button">Zamknij</button>
            <iframe class="phone-screen" id="phone-screen" title="Podgląd strony w rozmiarze telefonu"></iframe>
        </div>
    </div>
    <script>
        const modal = document.getElementById('phone-modal');
        const screen = document.getElementById('phone-screen');
        document.querySelectorAll('[data-phone-preview]').forEach((button) => {
            button.addEventListener('click', () => {
                screen.src = button.dataset.phonePreview;
                modal.hidden = false;
            });
        });
        document.getElementById('phone-close').addEventListener('click', () => {
            modal.hidden = true;
            screen.src = '';
        });
        modal.addEventListener('click', (event) => {
            if (event.target === modal) document.getElementById('phone-close').click();
        });
    </script>
</body>
</html>
